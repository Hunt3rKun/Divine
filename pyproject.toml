[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "divine"
version = "0.1.0"
description = "多智能体自动化渗透测试框架"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "openai>=1.90.0",
    "anthropic>=0.60.0",
    "dashscope>=1.25.11",
    "zhipuai>=2.1.5",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
divine = "divine.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
